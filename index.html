<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Energieberatung‑NRW – Strom & Gas sparen statt zahlen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg-dark: #0f1c2e;
      --bg-light: #f5f7fb;
      --gold: #d4a94a;
      --green: #3aa65a;
      --white: #ffffff;
      --text-dark: #1f2933;
      --accent-blue: #1b3b6b;
      --border-soft: #dde3f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: var(--bg-light);
      color: var(--text-dark);
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* HEADER */
    header {
      background: var(--bg-dark);
      color: var(--white);
      padding: 16px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
      font-weight: 600;
      letter-spacing: 0.05em;
      font-size: 1.1rem;
    }

    .logo-img {
      height: 64px;
      width: auto;
      border-radius: 50%;
    }

    nav {
      display: flex;
      gap: 24px;
      font-size: 0.95rem;
    }

    nav a {
      position: relative;
      padding-bottom: 4px;
    }

    nav a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 2px;
      background: var(--gold);
      transition: width 0.2s ease;
    }

    nav a:hover::after {
      width: 100%;
    }

    /* LAYOUT */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 16px 60px;
    }

    section {
      margin-bottom: 48px;
    }

    /* HERO */
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
      gap: 32px;
      align-items: center;
      padding: 32px 24px;
      border-radius: 18px;
      background: radial-gradient(circle at top left, #1b3b6b 0, #0f1c2e 55%);
      color: var(--white);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }

    .hero h1 {
      font-size: 2.2rem;
      margin-bottom: 12px;
    }

    .hero p {
      font-size: 1rem;
      opacity: 0.9;
      margin-bottom: 18px;
    }

    .hero-highlight {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(212, 169, 74, 0.6);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
      color: var(--gold);
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    .btn-primary {
      background: var(--gold);
      color: var(--bg-dark);
      padding: 10px 20px;
      border-radius: 999px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
    }

    .btn-primary:hover {
      background: var(--green);
      color: var(--white);
    }

    .btn-secondary {
      background: transparent;
      color: var(--white);
      padding: 10px 20px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      font-weight: 500;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    /* 3-SÄULEN */
    .pill-section-title {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
      color: var(--accent-blue);
      background: #ffffff;
    }

    .section-heading {
      font-size: 1.4rem;
      margin-bottom: 8px;
    }

    .section-sub {
      font-size: 0.95rem;
      color: #5a6475;
      margin-bottom: 18px;
    }

    .three-columns {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      background: #ffffff;
      border-radius: 14px;
      padding: 16px;
      border: 1px solid var(--border-soft);
      box-shadow: 0 8px 18px rgba(15, 28, 46, 0.06);
    }

    .card h3 {
      font-size: 1rem;
      margin-bottom: 6px;
      color: var(--accent-blue);
    }

    .card p {
      font-size: 0.9rem;
      color: #5a6475;
    }

    /* TARIFCHECK */
    .tarifcheck {
      background: #ffffff;
      border-radius: 18px;
      padding: 22px 20px;
